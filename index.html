<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>バーコード商品ビューア</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html5-qrcode/2.3.8/html5-qrcode.min.js"></script>
<style>
:root{--bg:#f3f7f5;--card:#fff;--ink:#16302b;--sub:#5d746e;--line:#d5e2de;--accent:#0f8b6d;--accent-ink:#fff}
@media (prefers-color-scheme:dark){:root{--bg:#0e1b18;--card:#162824;--ink:#e6f3ef;--sub:#93aba4;--line:#274039;--accent:#3cc9a3;--accent-ink:#06231b}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Hiragino Sans","Noto Sans JP",sans-serif;line-height:1.6;padding:env(safe-area-inset-top,0) 0 env(safe-area-inset-bottom,0)}
main{max-width:480px;margin:0 auto;padding:20px 16px 32px}
h1{font-size:20px;margin:0 0 12px}
button{font:inherit;cursor:pointer;border:0;border-radius:10px;padding:12px 18px;background:var(--accent);color:var(--accent-ink);font-weight:700;width:100%}
button.sub{background:var(--card);color:var(--ink);border:1px solid var(--line)}
button:focus-visible,input:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
#reader{margin-top:12px;width:100%}
#reader video{width:100% !important;height:auto !important;display:block;border-radius:14px}
.row{display:flex;gap:8px;margin-top:12px}
input{flex:1;min-width:0;font-size:18px;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink)}
.row button{width:auto}
.result{margin-top:16px;background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.result img{display:block;width:100%;max-height:320px;object-fit:contain;background:#fff}
.info{padding:14px 16px}
.name{font-size:18px;font-weight:700;margin:0}
.meta{margin:4px 0 0;color:var(--sub);font-size:14px}
.empty{padding:22px 16px;color:var(--sub);font-size:14px;text-align:center}
</style>
</head>
<body>
<main>
  <h1>バーコード商品ビューア</h1>
  <button id="start">カメラで読み取る</button>
  <div id="reader"></div>
  <div class="row">
    <input id="code" inputmode="numeric" maxlength="13" placeholder="数字を直接入力" aria-label="バーコードの数字">
    <button class="sub" id="go">調べる</button>
  </div>
  <section class="result" id="out" aria-live="polite">
    <div class="empty">バーコードを読み取ると、商品の画像が出ます。</div>
  </section>
</main>

<script>
var out = document.getElementById("out"), reader = null, busy = false;
var esc = function (s) { return String(s).replace(/[&<>"]/g, function (c) { return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]; }); };

async function lookup(code) {
  out.innerHTML = '<div class="empty">' + esc(code) + ' を検索中…</div>';
  try {
    var r = await fetch("https://world.openfoodfacts.org/api/v2/product/" + encodeURIComponent(code) + ".json?fields=product_name,brands,image_front_url");
    var d = await r.json();
    if (d.status !== 1 || !d.product) throw 0;
    var p = d.product;
    out.innerHTML = (p.image_front_url ? '<img src="' + esc(p.image_front_url) + '" alt="商品画像">' : '') +
      '<div class="info"><p class="name">' + esc(p.product_name || "名称不明") + '</p>' +
      '<p class="meta">' + esc(p.brands || "") + '</p><p class="meta">' + esc(code) + '</p></div>';
  } catch (e) {
    out.innerHTML = '<div class="empty">' + esc(code) + ' の商品が見つかりませんでした。食品・飲料以外は登録が少ないことがあります。</div>';
  }
}

async function stop() {
  if (reader) { try { await reader.stop(); reader.clear(); } catch (e) {} reader = null; }
  document.getElementById("start").textContent = "カメラで読み取る";
}

document.getElementById("start").onclick = async function () {
  if (reader) { stop(); return; }
  reader = new Html5Qrcode("reader", { formatsToSupport: [Html5QrcodeSupportedFormats.EAN_13, Html5QrcodeSupportedFormats.EAN_8, Html5QrcodeSupportedFormats.UPC_A, Html5QrcodeSupportedFormats.UPC_E] });
  try {
    await reader.start({ facingMode: "environment" }, { fps: 10, aspectRatio: 1.3333, qrbox: { width: 260, height: 140 } }, function (text) {
      if (busy) return; busy = true;
      document.getElementById("code").value = text;
      stop().then(function () { return lookup(text); }).then(function () { busy = false; });
    });
    this.textContent = "読み取りを止める";
  } catch (e) {
    reader = null;
    out.innerHTML = '<div class="empty">カメラを開けませんでした。Safariの設定でカメラを許可し、https:// のアドレスで開いているか確認してください。</div>';
  }
};

document.getElementById("go").onclick = function () {
  var v = document.getElementById("code").value.replace(/\D/g, "");
  if (v) lookup(v);
};
</script>
</body>
</html>
